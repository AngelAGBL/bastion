services:
  mongo:
    image: mongo:8.2
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      GLIBC_TUNABLES: glibc.cpu.hwcaps=-SHSTK

  app:
    image: bastion
    build:
      context: ..
      dockerfile: Dockerfile
      target: deploy
    restart: unless-stopped
    environment:
      PORT_HTTP: 3000
      PORT_WS: 3001
      MONGO_URI: mongodb://mongo:27017/bastion
      JWT_SECRET: change-this-to-something-random-at-least-32!!
      WSHOST: bastion.example.com:443
      TLS_MODE: proxy
    volumes:
      - ca_data:/app/data
    depends_on:
      - mongo

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs
      - ca_data:/etc/nginx/ca:ro
    depends_on:
      - app

volumes:
  mongo_data:
  ca_data:
  certs:
